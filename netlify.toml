[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"

# The CV is replaced whenever the CV is updated, so the browser must
# revalidate it on every request instead of serving a day-old copy.
[[headers]]
  for = "/*.pdf"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
  from = "/cv"
  to = "/Shubham_Subrot_Panigrahi_CV.pdf"
  status = 302

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
